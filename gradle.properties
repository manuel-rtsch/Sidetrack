org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# Task-output cache. CI already restores the whole Gradle User Home `caches` directory (setup-gradle
# with `gradle-home-cache-includes: caches`), so this makes compiled classes, R8 output and lint
# analysis reusable between runs and between jobs instead of rebuilt from scratch every time.
org.gradle.caching=true
kotlin.code.style=official

# Duplicated lines `./gradlew cpdCheck` tolerates, measured with --ignore-identifiers
# --ignore-literals at 80 tokens. Lower it whenever a block from the duplication section of
# TODO.md is cleaned; never raise it without deciding the new duplication is deliberate.
sidetrack.cpd.maxDuplicateLines=74

name: _pack dispatch test

# TEMPORARY. Proves APP_PACK_DISPATCH_TOKEN works from inside Actions exactly the
# way the release workflow uses it. Deleted immediately after a green run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the pack to rebuild
        env:
          TOKEN: ${{ secrets.APP_PACK_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$TOKEN" ] || { echo "::error::secret is empty"; exit 1; }
          echo "token length: ${#TOKEN}"
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/manuel-rtsch/sidetrack-pack/dispatches \
            -d '{"event_type":"app-released"}')
          echo "HTTP $code"
          cat resp.txt
          [ "$code" = 204 ]

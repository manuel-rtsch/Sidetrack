name: Android build setup
description: Install the JDK, Android SDK platform and Gradle caching used by every CI job.

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"

    - name: Set up Android SDK
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        packages: platform-tools platforms;android-37.0 build-tools;37.0.0

    # v6 moved Gradle User Home caching into `gradle-actions-caching`, a closed-source component
    # governed by Gradle's Terms of Use. `cache-provider: basic` keeps this repo on the MIT path: it
    # is a thin wrapper over actions/cache with the same strategy setup-java's `cache: gradle` uses.
    # It restores coarser entries than the enhanced provider, but no proprietary code runs in CI.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-provider: basic
